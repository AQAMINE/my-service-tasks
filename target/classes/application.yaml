server:
  port: 8084

spring:
  application:
    name: my-service-tasks

  datasource:
    url: jdbc:postgresql://localhost:5435/my_tasks_db?currentSchema=public
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    create-schemas: true
    baseline-on-migrate: false
    out-of-order: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/my-service-realm

keycloak:
  server-url: http://localhost:8085
  realm: my-service-realm
  client-id: my-service-tasks
  client-secret: "votre-client-secret"
  username: admin
  password: admin

logging:
  level:
    org.springframework.security: DEBUG
    com.myservicetasks: DEBUG