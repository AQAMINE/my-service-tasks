server:
  port: 8084

spring:
  application:
    name: aegis-tasks

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/my_tasks_db?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    create-schemas: true
    baseline-on-migrate: false
    out-of-order: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8085/realms/my-service-realm}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8085}
  realm: ${KEYCLOAK_REALM:my-service-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:my-service-tasks}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  username: ${KEYCLOAK_ADMIN_USERNAME:}
  password: ${KEYCLOAK_ADMIN_PASSWORD:}

logging:
  level:
    org.springframework.security: INFO
    com.myservicetasks: INFO
